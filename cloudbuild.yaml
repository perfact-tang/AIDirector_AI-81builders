steps:
  - name: gcr.io/cloud-builders/docker
    args: ['pull', '${_CACHE_IMAGE}']
    allowFailure: true
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--cache-from', '${_CACHE_IMAGE}', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
